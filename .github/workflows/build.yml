name: 精简版多平台编译

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 1.8.0)"
        required: true
        default: "custom"

jobs:
  build:
    name: 编译 - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          # 安卓二进制 (arm64 即 armv8)
          - { name: android-arm64, os: android, arch: arm64 }
          # Windows 二进制
          - { name: windows-amd64, os: windows, arch: amd64, suffix: .exe }
          # Linux 二进制
          - { name: linux-amd64, os: linux, arch: amd64 }
          - { name: linux-arm64, os: linux, arch: arm64 }
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 稳定版 Go

      - name: 执行编译
        run: |
          export GOOS=${{ matrix.platform.os }}
          export GOARCH=${{ matrix.platform.arch }}
          export CGO_ENABLED=0
          
          # 使用你之前截图要求的默认标签 + naive_outbound
          TAGS="with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_gvisor,with_tailscale,with_naive_outbound"
          
          go build -v \
            -tags "$TAGS" \
            -trimpath \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }}" \
            -o "dist/sing-box-${{ matrix.platform.name }}${{ matrix.platform.suffix }}" ./cmd/sing-box

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: dist/
          
